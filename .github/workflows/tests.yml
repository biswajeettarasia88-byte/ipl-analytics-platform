name: IPL Analytics CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Linting Checks
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
        
    - name: Verify Project Structure
      run: |
        test -d "data" || echo "data dir missing"
        test -d "sql" || echo "sql dir missing"
        test -d "src" || echo "src dir missing"
        test -d "models" || echo "models dir missing"
        test -f "Dockerfile" || echo "Dockerfile missing"
        
    - name: Run Pytest Test Suite
      env:
        PYTHONPATH: ${{ github.workspace }}
        # Do not expose secrets in plaintext here. We use GitHub Secrets mapping.
        # DB_USER: ${{ secrets.DB_USER }}
      run: |
        pytest tests/

